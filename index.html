<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="magic wish">
<title>magic wish</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f5f4; --ink:#111; --ink2:#555; --mute:#8a8a8a; --soft:#c4c4c4; --chip:#e9e9e8; --line:#e2e2e2;
    --card:#fff; --paper:#fff; --glass:rgba(255,255,255,.84); --dot:rgba(0,0,0,.07); --shade:rgba(0,0,0,.08);
    --lime:#e4f77a;
    --ease:cubic-bezier(.65,0,.2,1);
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#121212; --ink:#f1f1f0; --ink2:#c8c8c6; --mute:#8d8d8b; --soft:#565655; --chip:#2a2a2a; --line:#2f2f2e;
    --card:#1e1e1e; --paper:#f3f3f1; --glass:rgba(32,32,32,.84); --dot:rgba(255,255,255,.07); --shade:rgba(0,0,0,.4);
    color-scheme:dark;
  }
  @media (prefers-color-scheme: dark){ :root[data-theme="auto"]{
    --bg:#121212; --ink:#f1f1f0; --ink2:#c8c8c6; --mute:#8d8d8b; --soft:#565655; --chip:#2a2a2a; --line:#2f2f2e;
    --card:#1e1e1e; --paper:#f3f3f1; --glass:rgba(32,32,32,.84); --dot:rgba(255,255,255,.07); --shade:rgba(0,0,0,.4);
    color-scheme:dark;
  } }
  body,#home,#list,#profile,.sheet{transition:background-color .35s}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;letter-spacing:.005em;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input,textarea{font:inherit;color:inherit}
  input,textarea,select{font-size:16px} /* iOS zooms into anything smaller when it gets focus */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}

  /* ---------- avatar ---------- */
  .av{border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--lime);color:#2c3a00;font-weight:500;flex:none;position:relative}
  .av img{width:100%;height:100%;object-fit:cover;display:block}

  /* ---------- home ---------- */
  #home{position:fixed;inset:0;display:flex;flex-direction:column;transition:transform .7s var(--ease),opacity .55s var(--ease),filter .6s var(--ease);will-change:transform}
  #home.away{opacity:0;filter:blur(6px)}
  .h-top{padding:calc(env(safe-area-inset-top) + 18px) 18px 0 22px;display:flex;justify-content:space-between;align-items:center}
  .logo{font-weight:500;font-size:19px;letter-spacing:-.01em}
  .h-sub{font-size:12.5px;color:var(--mute);margin-top:2px;min-height:1em}
  .person .bob{display:flex;flex-direction:column;align-items:center;gap:12px;animation:bob 6s ease-in-out infinite}
  .person .av{font-size:34px;box-shadow:0 14px 34px rgba(0,0,0,.08);transition:transform .25s var(--ease)}
  .person:active .av{transform:scale(.94)}
  .person .pn{font-size:15px;font-weight:500}
  .person .pc{font-size:12.5px;color:var(--mute);margin-top:-8px}
  .person.setup .av{background:var(--card);color:var(--soft);font-size:30px;font-weight:300;border:1.5px dashed var(--soft);box-shadow:none}
  .edit-me{position:absolute;right:4px;bottom:4px;width:30px;height:30px;border-radius:50%;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:13px}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .h-top{position:relative;z-index:3}
  .h-foot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);text-align:center;font-size:12px;color:var(--soft);pointer-events:none;z-index:3}

  /* ---------- list (the "inside" of a circle) ---------- */
  #list{position:fixed;inset:0;background:var(--bg);overflow:hidden;clip-path:circle(0px at 50% 50%);visibility:hidden;z-index:2;-webkit-overflow-scrolling:touch}
  #list.open{visibility:visible}
  #list.anim{transition:clip-path .75s var(--ease)}
  .l-head{position:absolute;left:0;right:0;top:0;z-index:3;padding:calc(env(safe-area-inset-top) + 16px) 18px 18px;background:linear-gradient(var(--bg) 72%, transparent);transition:transform .75s var(--ease),opacity .5s ease}
  .l-head > *{max-width:1040px;margin-left:auto;margin-right:auto}
  #lb{transition:transform .75s var(--ease),opacity .5s ease;transform-origin:50% 40%}
  #list:not(.shown) .l-head{opacity:0;transform:translateY(-10px)}
  #list:not(.shown) #lb{transform:scale(.82);opacity:0}
  .l-top{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;margin-bottom:16px}
  .round{width:36px;height:36px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .l-title{text-align:center;font-weight:500;font-size:16px}

  .chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px 4px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:9px 14px;border-radius:999px;color:var(--ink2);font-size:15px;white-space:nowrap;transition:background .15s}
  .chip .n{color:var(--soft);font-size:12px;margin-left:5px;font-variant-numeric:tabular-nums}
  .chip.on{background:var(--chip);color:var(--ink)}
  .chip.on .n{color:var(--mute)}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:34px 12px;margin-top:28px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:56px 20px}}
  .item{text-align:center;display:flex;flex-direction:column;align-items:center;animation:fade .45s ease both}
  .item .ph{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .item img{max-width:82%;max-height:82%;object-fit:contain;mix-blend-mode:multiply}
  .item .ph.empty{color:var(--soft);font-size:28px;font-weight:300}
  .item .nm{font-size:15px;line-height:1.3;padding:0 4px}
  .item .br{font-size:13px;color:var(--mute);margin-top:3px}
  .item.done{opacity:.38}
  .item.done .nm{text-decoration:line-through;text-decoration-thickness:1px}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}}
  .empty-state{text-align:center;color:var(--mute);padding:90px 20px;font-size:14px;line-height:1.6}
  .empty-state b{display:block;color:var(--ink);font-weight:500;font-size:16px;margin-bottom:4px}

  /* bottom bar: avatar pill + add */
  .dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;justify-content:space-between;align-items:center;padding:0 18px;z-index:4;pointer-events:none;opacity:0;transform:translateY(20px);transition:opacity .4s ease .25s,transform .5s var(--ease) .25s}
  .dock.on{opacity:1;transform:none}
  .dock>*{pointer-events:auto}
  .pill{display:flex;align-items:center;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:5px;box-shadow:0 6px 22px rgba(0,0,0,.09)}
  .pill button{margin-left:-12px;border-radius:50%;padding:2px;background:transparent;transition:transform .2s var(--ease)}
  .pill button:first-child{margin-left:0}
  .pill .av{width:40px;height:40px;font-size:13px;border:2px solid var(--bg)}
  .pill button.cur .av{border-color:var(--ink)}
  .pill button:active{transform:scale(.9)}
  .pill .home-btn{width:44px;height:44px;margin-left:4px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
  .add{width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:26px;font-weight:300;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.16)}
  .add[hidden]{display:none}

  /* ---------- sheets ---------- */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:11;padding:10px 22px calc(env(safe-area-inset-bottom) + 26px)}
  @media(min-width:640px){.sheet{max-width:460px;margin:0 auto}}
  .sheet.on{transform:none}
  .grab{width:36px;height:4px;border-radius:4px;background:var(--soft);margin:0 auto 14px}
  .d-img{aspect-ratio:1.2;display:flex;align-items:center;justify-content:center;background:var(--paper);border-radius:22px;overflow:hidden}
  .d-img:has(img.cutout){background:transparent;overflow:visible}
  .d-img img{max-width:72%;max-height:88%;object-fit:contain;mix-blend-mode:multiply}
  .d-name{font-size:22px;font-weight:500;text-align:center;margin-top:6px;letter-spacing:-.01em}
  .d-brand{text-align:center;color:var(--mute);margin-top:4px}
  .d-price{text-align:center;margin-top:12px;font-variant-numeric:tabular-nums}
  .d-desc{color:var(--ink2);line-height:1.55;margin:22px 0 0;white-space:pre-wrap;font-size:14.5px}
  .d-meta{color:var(--mute);font-size:12.5px;text-align:center;margin-top:22px}
  .d-link{display:block;text-align:center;margin-top:22px;padding:14px;border-radius:14px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:500;font-size:14px}
  .row{display:flex;gap:8px;margin-top:10px}
  .btn{flex:1;padding:13px;border-radius:14px;background:var(--chip);font-size:14px;font-weight:500;text-align:center}
  .btn.danger{color:#c0392b}
  .btn.dark{background:var(--ink);color:var(--bg)}
  .f-title{text-align:center;font-weight:500;margin-bottom:14px}
  .pick{display:flex;align-items:center;justify-content:center;aspect-ratio:1.5;border-radius:18px;background:var(--paper);color:var(--mute);font-size:13px;overflow:hidden;position:relative;width:100%}
  .pick img{max-width:70%;max-height:85%;object-fit:contain}
  .pick .hint{position:absolute;bottom:10px;font-size:11.5px;color:var(--soft)}
  .pick-av{margin:6px auto 8px;width:112px;height:112px;font-size:13px;color:var(--mute);background:var(--card);border:1.5px dashed var(--soft)}
  .field{display:block;border-bottom:1px solid var(--line);padding:14px 0 10px}
  .field span{display:block;font-size:11.5px;color:var(--mute);margin-bottom:5px}
  .field input,.field textarea{width:100%;border:0;background:transparent;outline:none;font-size:16px;padding:0;resize:none}
  .field textarea{min-height:60px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .cats button{padding:6px 11px;border-radius:999px;background:var(--card);font-size:13px;color:var(--ink2)}
  .cats button.on{background:var(--ink);color:var(--bg)}
  .link-box{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:6px 6px 6px 16px;margin-bottom:6px}
  .link-box input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px;padding:9px 0}
  .auto{flex:none;background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 13px;font-size:13px;font-weight:500}
  .auto[hidden]{display:none}
  .auto-status{font-size:12.5px;color:var(--mute);text-align:center;min-height:0;max-height:0;overflow:hidden;transition:max-height .3s,margin .3s;margin:0}
  .auto-status.on{max-height:60px;margin:4px 0 12px}
  .auto-status.ok{color:#4a6b00}
  .auto-status.warn{color:#9a6a00}
  .auto-status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-right:7px;vertical-align:1px;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.2;transform:scale(.6)}}
  .field input.filled,.field textarea.filled{animation:flash 1.2s ease}
  @keyframes flash{0%{background:var(--lime)}100%{background:transparent}}
  .err{color:#c0392b;font-size:13px;text-align:center;margin-top:10px;min-height:1em}
  .toast{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translate(-50%,-80px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;transition:transform .3s;z-index:20;white-space:nowrap}
  .toast.on{transform:translate(-50%,0)}
  @media (prefers-reduced-motion: reduce){ .bob{animation:none!important} #list.anim,#lb,.l-head,#home{transition-duration:.01s} }

  .pick-row{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 2px;justify-content:center;flex-wrap:wrap}
  .pick-person{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px}
  .pick-person .av{width:56px;height:56px;font-size:17px}
  .person.setup .av{background:var(--card);color:var(--soft);font-size:30px;font-weight:300;border:1.5px dashed var(--soft);box-shadow:none}
  .btn:disabled{opacity:.6}

  /* ---------- infinite boards (pan / pinch / jelly) ---------- */
  .board{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
    background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.2px);background-size:22px 22px}
  .board.grabbing{cursor:grabbing}
  .world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;--jx:0;--jy:0;--jr:0}
  .board img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
  .card{position:absolute;padding:0;text-align:left;display:block;
    transform:translate(calc(var(--jx)*var(--d)*1px),calc(var(--jy)*var(--d)*1px)) rotate(calc(var(--r)*1deg + var(--jr)*var(--d)*1deg));
    animation:pop .55s cubic-bezier(.2,.9,.25,1.25) both}
  @keyframes pop{from{opacity:0;scale:.82}}
  .card .cimg{background:var(--paper);border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:scale .2s var(--ease)}
  .card:active .cimg{scale:.97}
  .card .cimg img{max-width:84%;max-height:84%;object-fit:contain;mix-blend-mode:multiply}
  .card .cimg.empty{color:var(--soft);font-size:34px;font-weight:300}
  .card .string{display:block;width:1.5px;height:16px;margin:0 0 0 24px;background:var(--soft);transform-origin:top;
    transform:rotate(calc(var(--jx)*-2deg))}
  .card .tag{display:inline-flex;flex-direction:column;max-width:100%;background:var(--card);border-radius:14px;padding:8px 12px 9px;box-shadow:0 6px 18px rgba(0,0,0,.07);
    transform:translate(calc(var(--jx)*1.1px),calc(var(--jy)*.8px)) rotate(calc(var(--jr)*-1.4deg));transform-origin:24px -16px}
  .card .tag b{font-weight:500;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card .tag span{font-size:11.5px;color:var(--mute);margin-top:2px}
  .card.done{opacity:.4}
  .card.done .tag b{text-decoration:line-through;text-decoration-thickness:1px}
  .person.card{display:flex;flex-direction:column;align-items:center;text-align:center}
  .zoom-pill{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 42px);z-index:5;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-radius:999px;padding:6px 11px;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink2);box-shadow:0 4px 14px rgba(0,0,0,.08);transition:opacity .4s}
  #list .zoom-pill{bottom:calc(env(safe-area-inset-bottom) + 30px)}
  .zoom-pill.idle{opacity:.55}
  .board-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}

  /* ---------- my avatar button + profile screen ---------- */
  .me-btn{width:40px;height:40px;border-radius:50%;padding:0;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.08);transition:transform .2s var(--ease)}
  .me-btn:active{transform:scale(.92)}
  .me-btn .av{width:40px;height:40px;font-size:14px;border:2px solid var(--bg)}
  .me-btn.join{width:auto;height:36px;padding:0 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;box-shadow:none}
  #profile{position:fixed;inset:0;background:var(--bg);z-index:8;overflow-y:auto;transform:translateX(102%);transition:transform .5s var(--ease);box-shadow:-20px 0 40px rgba(0,0,0,.06)}
  #profile.on{transform:none}
  #home.pushed{transform:translateX(-22%) !important;opacity:.6}
  .pf{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 22px calc(env(safe-area-inset-bottom) + 40px)}
  .pf-top{display:grid;grid-template-columns:36px 1fr 36px;align-items:center}
  .pf-top .t{text-align:center;font-weight:500;font-size:16px}
  .pf-av{width:148px;height:148px;margin:34px auto 0;font-size:44px;box-shadow:0 18px 40px rgba(0,0,0,.10)}
  .pf-av.edit{cursor:pointer}
  .pf-av .cam{position:absolute;inset:auto 0 0 0;height:38%;background:rgba(0,0,0,.42);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;letter-spacing:.02em}
  .pf-name{text-align:center;font-size:25px;font-weight:500;letter-spacing:-.015em;margin-top:20px}
  .pf-since{text-align:center;color:var(--mute);font-size:13px;margin-top:5px}
  .pf-stats{display:grid;grid-template-columns:repeat(3,1fr);margin:30px 0 26px;background:var(--card);border-radius:20px;padding:16px 6px}
  .pf-stats div{text-align:center}
  .pf-stats b{display:block;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
  .pf-stats span{font-size:12px;color:var(--mute)}
  .pf-stats div+div{border-left:1px solid var(--line)}
  .pf .btn{display:block;width:100%;padding:15px}
  .pf .row .btn{width:auto}
  .pf-link{display:block;width:100%;text-align:center;color:var(--mute);font-size:13px;margin-top:26px;padding:8px}
  .pf-form{margin-top:22px;background:var(--card);border-radius:20px;padding:4px 18px}
  .pf-form .field:last-child{border-bottom:0}

  /* ---------- themes: islands on the board + stickers ---------- */
  .island{position:absolute;border-radius:44px;background:var(--tc);
    transform:translate(calc(var(--jx)*.25px),calc(var(--jy)*.25px)) rotate(calc(var(--r)*1deg + var(--jr)*.2deg));
    animation:pop .6s cubic-bezier(.2,.9,.25,1.15) both}
  .isl-label{position:absolute;left:22px;top:-18px;display:inline-flex;align-items:center;gap:7px;background:var(--card);color:var(--ti);border-radius:999px;
    padding:8px 14px 8px 10px;font-size:14px;font-weight:500;box-shadow:0 8px 20px rgba(0,0,0,.08);transform:rotate(-2.5deg);white-space:nowrap}
  .isl-label .e{font-size:18px;line-height:1}
  .isl-label .n{color:var(--mute);font-weight:400;font-size:12.5px}
  .card .stk{position:absolute;top:-10px;right:-8px;width:32px;height:32px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;
    font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.12);transform:rotate(12deg);z-index:1}
  .d-theme{display:table;margin:12px auto 0;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;background:var(--tc);color:var(--ti)}
  .themes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .themes button{padding:7px 11px;border-radius:999px;background:var(--card);font-size:13px;color:var(--ink2);transition:background .15s,transform .15s}
  .themes button.on{background:var(--tc);color:var(--ti);font-weight:500;box-shadow:inset 0 0 0 1.5px var(--ti)}
  .themes button:active{transform:scale(.95)}

  /* ---------- filter bar: tag dropdown + theme chips ---------- */
  .fbar{display:flex;align-items:center;gap:8px}
  .dd{position:relative;flex:none}
  .dd-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 12px 9px 15px;border-radius:999px;background:var(--chip);font-size:15px;color:var(--ink)}
  .dd-btn .n{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
  .dd-btn .car{font-style:normal;font-size:10px;color:#666;transition:transform .25s var(--ease);margin-left:1px}
  .dd.open .car{transform:rotate(180deg)}

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { SUPABASE_URL, SUPABASE_KEY } from "./config.js";

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = "images";
const DEFAULT_CATS = ["Tech","Beauty","Clothes","Home","Books","Experiences","Other"];
const ME_KEY = "akkidellie.me";
/* ---------- appearance (per device) ---------- */
const MODE_KEY = "magicwish.mode";
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
function applyMode(){
  let m; try{ m = localStorage.getItem(MODE_KEY); }catch(e){}
  document.documentElement.dataset.theme = m === "light" || m === "dark" ? m : "auto";
  const meta = document.querySelector('meta[name="theme-color"]'); if(meta) meta.content = isDark() ? "#121212" : "#f5f5f4";
}
const isDark = () => { const t = document.documentElement.dataset.theme; return t === "dark" || (t === "auto" && darkMQ.matches); };
applyMode();
darkMQ.addEventListener?.("change", () => { applyMode(); if(S?.view) renderList(); });
const S = { ctheme:[], res:{}, items:[], people:[], me:null, view:null, cat:"All", editing:null, draft:null, openId:null, anim:false, loaded:false };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => { if(!u) return ""; let s=String(u).trim(); if(!/^https?:\/\//i.test(s)) s="https://"+s; try{const x=new URL(s); return /^https?:$/.test(x.protocol)?x.href:"";}catch(e){return "";} };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),2200); }
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} };

/* ---------- people helpers ---------- */
const personById = id => S.people.find(p => p.id === id) || null;
const displayName = id => personById(id)?.name || "Friend";
const isMine = id => !!S.me && id === S.me;
function avatarHTML(id){
  const p = personById(id);
  if(p?.avatar_url) return `<img src="${esc(p.avatar_url)}" alt="">`;
  const parts = (p?.name || "?").trim().split(/\s+/);
  return esc(((parts[0]||"?")[0] + (parts[1]?.[0]||"")).toUpperCase());
}
function personList(){
  return [...S.people].sort((a,b) => (a.id===S.me?-1:b.id===S.me?1:0) || (a.created_at||"").localeCompare(b.created_at||"")).map(p=>p.id);
}


/* ---------- infinite board: pan with inertia, pinch / wheel zoom, jelly lag ---------- */
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function rng(seed){ let h = 2166136261; for(const ch of String(seed)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61); return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
class Board{
  constructor(vp, world, pill, opts = {}){
    Object.assign(this, { vp, w:world, pill, x:0, y:0, z:1, vx:0, vy:0, sx:0, sy:0, ptrs:new Map(), drag:false, raf:0,
      minZ:.3, maxZ:2.6, top:opts.top || 0, bottom:opts.bottom || 0, fitMax:opts.fitMax || 1, colW:opts.colW || 0,
      b:{ minX:0, minY:0, maxX:0, maxY:0 } });
    vp.addEventListener("pointerdown", e => this.down(e));
    vp.addEventListener("pointermove", e => this.move(e));
    ["pointerup","pointercancel"].forEach(t => vp.addEventListener(t, e => this.up(e)));
    vp.addEventListener("click", e => { if(this.suppress){ e.stopPropagation(); e.preventDefault(); this.suppress = false; } }, true);
    vp.addEventListener("wheel", e => this.wheel(e), { passive:false });
    vp.addEventListener("gesturestart", e => e.preventDefault());
    if(pill) pill.onclick = () => this.fit(true);
    addEventListener("resize", () => this.fit(false));
    this.apply();
  }
  get vw(){ return this.vp.clientWidth; } get vh(){ return this.vp.clientHeight; }
  apply(){
    this.w.style.transform = `translate3d(${this.x}px,${this.y}px,0) scale(${this.z})`;
    if(this.pill){ const t = Math.round(this.z*100) + "%"; if(this.pill.textContent !== t) this.pill.textContent = t; }
  }
  showPill(){ if(!this.pill) return; this.pill.classList.remove("idle"); clearTimeout(this._pt); this._pt = setTimeout(() => this.pill.classList.add("idle"), 1400); }
  range(){ // where the world may sit: any content edge can travel to the middle of the screen
    const b = this.b, z = this.z, vw = this.vw, vh = this.vh;
    return { x0: vw*.5 - b.maxX*z, x1: vw*.5 - b.minX*z, y0: (this.top + (vh-this.top-this.bottom)*.5) - b.maxY*z, y1: (this.top + (vh-this.top-this.bottom)*.5) - b.minY*z };
  }
  local(cx, cy){ const r = this.vp.getBoundingClientRect(); return [cx - r.left, cy - r.top]; }
  zoomAt(nz, cx, cy){
    nz = clamp(nz, this.minZ, this.maxZ); const [lx, ly] = this.local(cx, cy);
    this.x = lx - (lx - this.x) * nz / this.z; this.y = ly - (ly - this.y) * nz / this.z; this.z = nz; this.showPill();
  }
  down(e){
    if(e.button > 0) return;
    this.ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY }); this.tween = null;
    if(this.ptrs.size === 1){ this.moved = 0; this.vx = this.vy = 0; this.lastT = performance.now(); }
    if(this.ptrs.size === 2){ const [a,b] = [...this.ptrs.values()]; this.pinch = { d:Math.hypot(a.x-b.x, a.y-b.y), z:this.z, mx:(a.x+b.x)/2, my:(a.y+b.y)/2 }; this.drag = true; }
    this.loop();
  }
  move(e){
    const p = this.ptrs.get(e.pointerId); if(!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if(this.ptrs.size === 1){
      this.moved += Math.abs(dx) + Math.abs(dy);
      if(!this.drag && this.moved > 7){ this.drag = true; this.vp.classList.add("grabbing"); try{ this.vp.setPointerCapture(e.pointerId); }catch(_){} }
      if(this.drag){
        const R = this.range(), rx = (this.x < R.x0 || this.x > R.x1) ? .35 : 1, ry = (this.y < R.y0 || this.y > R.y1) ? .35 : 1;
        this.x += dx*rx; this.y += dy*ry;
        const now = performance.now(), dt = Math.max(8, now - this.lastT); this.lastT = now;
        this.vx = this.vx*.4 + (dx/dt*16)*.6; this.vy = this.vy*.4 + (dy/dt*16)*.6;
      }
    } else if(this.ptrs.size === 2 && this.pinch){
      const [a,b] = [...this.ptrs.values()], d = Math.hypot(a.x-b.x, a.y-b.y), mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
      this.zoomAt(this.pinch.z * d / this.pinch.d, mx, my);
      this.x += mx - this.pinch.mx; this.y += my - this.pinch.my; this.pinch.mx = mx; this.pinch.my = my;
      this.vx = this.vy = 0;
    }
    this.apply();
  }
  up(e){
    if(!this.ptrs.delete(e.pointerId)) return;
    if(this.ptrs.size < 2) this.pinch = null;
    if(this.ptrs.size === 1){ this.lastT = performance.now(); }
    if(this.ptrs.size === 0){
      if(this.drag) this.suppress = true;
      if(performance.now() - this.lastT > 90){ this.vx = this.vy = 0; }
      this.drag = false; this.vp.classList.remove("grabbing");
      setTimeout(() => { this.suppress = false; }, 50);
    }
    this.loop();
  }
  wheel(e){
    e.preventDefault(); this.tween = null;
    if(e.ctrlKey || e.metaKey){ this.zoomAt(this.z * Math.exp(-e.deltaY * .01), e.clientX, e.clientY); }
    else { this.x -= e.deltaX; this.y -= e.deltaY; this.vx = -e.deltaX*.3; this.vy = -e.deltaY*.3; }
    this.apply(); this.loop();
  }
  loop(){ if(!this.raf) this.raf = requestAnimationFrame(() => this.tick()); }
  tick(){
    this.raf = 0; let busy = this.ptrs.size > 0;
    if(this.tween){
      const t = this.tween, k = clamp((performance.now() - t.t0) / t.ms, 0, 1), e = 1 - Math.pow(1-k, 3);
      this.x = t.x0 + (t.x1-t.x0)*e; this.y = t.y0 + (t.y1-t.y0)*e; this.z = t.z0 + (t.z1-t.z0)*e;
      if(k >= 1) this.tween = null; busy = true;
    } else if(!this.ptrs.size){
      this.x += this.vx; this.y += this.vy; this.vx *= .93; this.vy *= .93;
      const R = this.range();
      if(this.x < R.x0){ this.x += (R.x0 - this.x)*.16; this.vx *= .5; } else if(this.x > R.x1){ this.x += (R.x1 - this.x)*.16; this.vx *= .5; }
      if(this.y < R.y0){ this.y += (R.y0 - this.y)*.16; this.vy *= .5; } else if(this.y > R.y1){ this.y += (R.y1 - this.y)*.16; this.vy *= .5; }
      const out = this.x < R.x0-.5 || this.x > R.x1+.5 || this.y < R.y0-.5 || this.y > R.y1+.5;
      if(Math.abs(this.vx) > .05 || Math.abs(this.vy) > .05 || out) busy = true;
    } else if(this.drag && performance.now() - this.lastT > 60){ this.vx *= .7; this.vy *= .7; }
    // jelly: cards trail behind the motion and tilt a little
    this.sx += (this.vx - this.sx) * .18; this.sy += (this.vy - this.sy) * .18;
    if(Math.abs(this.sx) > .02 || Math.abs(this.sy) > .02) busy = true;
    const st = this.w.style;
    st.setProperty("--jx", clamp(-this.sx*1.1, -26, 26).toFixed(2));
    st.setProperty("--jy", clamp(-this.sy*1.1, -26, 26).toFixed(2));
    st.setProperty("--jr", clamp(this.sx*.32, -8, 8).toFixed(2));
    this.apply();
    if(busy) this.loop();
  }
  setBounds(b){ this.b = b; }
  focus(r){
    const availW = this.vw - 30, availH = this.vh - this.top - this.bottom - 10;
    const z = clamp(Math.min(availW / r.w, availH / Math.min(r.h, availH*1.6)), this.minZ, 1.15);
    const x1 = (this.vw - r.w*z)/2 - r.x*z, y1 = this.top + 26 - r.y*z;
    this.tween = { t0:performance.now(), ms:600, x0:this.x, y0:this.y, z0:this.z, x1, y1, z1:z }; this.vx = this.vy = 0; this.loop(); this.showPill();
  }
  fit(animate){
    const b = this.b, cw = Math.max(1, b.maxX - b.minX), ch = Math.max(1, b.maxY - b.minY);
    const availW = this.vw - 36, availH = this.vh - this.top - this.bottom - 20;
    let z = Math.min(availW / (this.colW ? Math.min(cw, this.colW) : cw), this.colW ? Infinity : availH / ch, this.fitMax);
    z = clamp(z, this.minZ, this.fitMax);
    const x = (this.vw - cw*z)/2 - b.minX*z;
    const y = (this.colW && ch*z > availH) ? this.top + 10 - b.minY*z : this.top + (availH - ch*z)/2 - b.minY*z;
    const tx = this.colW && cw*z > availW ? 18 - b.minX*z : x;
    if(animate){ this.tween = { t0:performance.now(), ms:520, x0:this.x, y0:this.y, z0:this.z, x1:tx, y1:y, z1:z }; this.loop(); }
    else { this.x = tx; this.y = y; this.z = z; this.vx = this.vy = 0; this.apply(); }
    this.showPill();
  }
}
["gesturestart","gesturechange"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive:false }));
const HB = new Board($("hb"), $("hw"), $("hz"), { top:80, bottom:60, fitMax:1 });
const LB = new Board($("lb"), $("lw"), $("lz"), { top:118, bottom:90, fitMax:1, colW:470 });

/* ---------- data ---------- */
async function load(){
  const [p, i, rv, th] = await Promise.all([
    sb.from("people").select("*"),
    sb.from("items").select("*").order("created_at", { ascending:false }),
    sb.from("reservations").select("*"),
    sb.from("themes").select("*").order("created_at")
  ]);
  if(p.error || i.error) throw (p.error || i.error);
  S.people = p.data; S.items = i.data;
  S.res = {}; (rv.data || []).forEach(r => S.res[r.item_id] = r);
  S.ctheme = th.data || [];
  if(S.me && !personById(S.me)){ S.me = null; lsSet(ME_KEY, null); }
  S.loaded = true;
  renderAll();
}
let reloadT;
const scheduleReload = () => { clearTimeout(reloadT); reloadT = setTimeout(() => load().catch(()=>{}), 250); };

(async () => {
  S.me = lsGet(ME_KEY);
  const timer = setTimeout(()=>{ if(!S.loaded) $("hmsg").innerHTML = `<div class="empty-state"><b>Can't reach the wishlists yet</b>Check your connection.</div>`; }, 10000);
  try{ await load(); clearTimeout(timer); }
  catch(e){ clearTimeout(timer); $("hmsg").innerHTML = `<div class="empty-state"><b>The wishlists aren't available right now</b>Try again in a moment.</div>`; return; }
  sb.channel("all")
    .on("postgres_changes", { event:"*", schema:"public", table:"items" }, scheduleReload)
    .on("postgres_changes", { event:"*", schema:"public", table:"people" }, scheduleReload)
    .on("postgres_changes", { event:"*", schema:"public", table:"reservations" }, scheduleReload)
    .on("postgres_changes", { event:"*", schema:"public", table:"themes" }, scheduleReload)
    .subscribe();
  document.addEventListener("visibilitychange", () => { if(!document.hidden) scheduleReload(); });
  if(!S.me) setTimeout(openWelcome, 500);
})();

function renderAll(){
  renderHome();
  if(S.view){ if(!personById(S.view)) { S.view=null; closeListNow(); } else { renderList(); renderDock(); } }
  if(S.openId){ if(S.items.find(i=>i.id===S.openId)) openDetail(S.openId, true); else closeSheets(); }
}

/* ---------- home ---------- */
function renderHome(){
  const ppl = personList();
  const open = S.items.filter(i=>!i.done).length;
  $("h-sub").textContent = open ? `${open} ${open===1?"wish":"wishes"}` : "";
  const nodes = ppl.map(id => ({ id, join:false }));
  if(!S.me) nodes.push({ id:"__join", join:true });
  // sunflower spiral: first circle in the middle, the rest spiralling out
  let minX=1e9, minY=1e9, maxX=-1e9, maxY=-1e9;
  const html = nodes.map((nd, i) => {
    const r = rng(nd.id), size = Math.round(nd.join ? 120 : (i === 0 ? 150 : 118 + r()*30));
    const ang = i * 2.39996 + .6, rad = i === 0 ? 0 : 168 * Math.sqrt(i) + r()*18;
    const cx = Math.cos(ang)*rad*1.05, cy = Math.sin(ang)*rad*1.12;
    const w = Math.max(size, 150), x = Math.round(cx - w/2), y = Math.round(cy - size/2);
    minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x + w); maxY = Math.max(maxY, y + size + 56);
    const style = `left:${x}px;top:${y}px;width:${w}px;--d:${(.55 + r()*.9).toFixed(2)};--r:0;animation-delay:${i*60}ms`;
    const bob = `style="animation-delay:-${(r()*6).toFixed(2)}s"`;
    if(nd.join) return `<button class="card person setup" data-join="1" style="${style}"><div class="bob" ${bob}><div class="av" style="width:${size}px;height:${size}px">+</div><div class="pn">Join</div><div class="pc">add your circle</div></div></button>`;
    const n = S.items.filter(it => it.person_id === nd.id && !it.done).length;
    return `<button class="card person" data-person="${esc(nd.id)}" style="${style}"><div class="bob" ${bob}>
      <div class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size/4)}px">${avatarHTML(nd.id)}</div>
      <div class="pn">${esc(displayName(nd.id))}${isMine(nd.id) ? " (you)" : ""}</div>
      <div class="pc">${bdaySoon(personById(nd.id)?.birthday) ? `<span class="bday">${bdaySoon(personById(nd.id)?.birthday)}</span> · ` : ``}${n ? n + (n===1?" wish":" wishes") : "no wishes yet"}</div></div></button>`;
  }).join("");
  $("hw").innerHTML = html;
  $("hmsg").innerHTML = nodes.length ? "" : `<div class="empty-state"><b>No one here yet</b></div>`;
  HB.setBounds({ minX:minX-20, minY:minY-10, maxX:maxX+20, maxY:maxY+10 });
  if(S.homeCount !== nodes.length){ S.homeCount = nodes.length; HB.fit(false); }
  const mb = $("me-btn");
  if(S.me && personById(S.me)){ mb.className = "me-btn"; mb.innerHTML = `<div class="av">${avatarHTML(S.me)}</div>`; }
  else { mb.className = "me-btn join"; mb.textContent = "Join"; }
  if($("profile").classList.contains("on") && !S.pfEditing) renderProfile();
}

/* ---------- the fall ---------- */
function circleAt(el){ const r = el.getBoundingClientRect(); return { x:r.left+r.width/2, y:r.top+r.height/2, r:r.width/2 }; }
const coverR = (x,y) => Math.hypot(Math.max(x, innerWidth-x), Math.max(y, innerHeight-y)) + 20;

async function fallInto(pid, fromEl){
  if(S.anim) return; S.anim = true;
  const c = fromEl ? circleAt(fromEl) : { x:innerWidth/2, y:innerHeight/2, r:30 };
  S.view = pid; S.cat = "All"; S.theme = null; renderList(); renderDock();
  const L = $("list"), H = $("home");
  L.scrollTop = 0; L.classList.remove("anim","shown");
  L.style.clipPath = `circle(${c.r}px at ${c.x}px ${c.y}px)`;
  L.classList.add("open"); H.style.transformOrigin = `${c.x}px ${c.y}px`;
  void L.offsetWidth;
  L.classList.add("anim","shown");
  L.style.clipPath = `circle(${coverR(c.x,c.y)}px at ${c.x}px ${c.y}px)`;
  H.style.transform = "scale(2.4)"; H.classList.add("away");
  $("dock").classList.add("on");
  history.replaceState(null, "", "#" + pid);
  await sleep(780); L.style.clipPath = "none"; S.anim = false;
}
function closeListNow(){ const L=$("list"),H=$("home"); L.classList.remove("open","anim","shown"); H.style.transform="none"; H.classList.remove("away"); $("dock").classList.remove("on"); history.replaceState(null,"",location.pathname); }
async function climbOut(){
  if(S.anim || !S.view) return; S.anim = true;
  const pid = S.view, H = $("home"), L = $("list");
  const target = document.querySelector(`.person[data-person="${CSS.escape(pid)}"] .av`);
  let c = { x:innerWidth/2, y:innerHeight/2, r:30 };
  if(target){ H.style.transition="none"; H.style.transform="none"; c = circleAt(target); H.style.transform="scale(2.4)"; void H.offsetWidth; H.style.transition=""; }
  H.style.transformOrigin = `${c.x}px ${c.y}px`;
  L.classList.remove("anim"); L.style.clipPath = `circle(${coverR(c.x,c.y)}px at ${c.x}px ${c.y}px)`;
  void L.offsetWidth;
  L.classList.add("anim"); L.classList.remove("shown");
  L.style.clipPath = `circle(${c.r}px at ${c.x}px ${c.y}px)`;
  H.style.transform = "none"; H.classList.remove("away"); $("dock").classList.remove("on");
  history.replaceState(null, "", location.pathname);
  await sleep(760); L.classList.remove("open","anim"); S.view = null; S.anim = false;
}
async function hopTo(pid, fromEl){
  if(S.anim || pid === S.view) return; S.anim = true;
  const c = circleAt(fromEl), L = $("list");
  L.classList.remove("anim"); L.style.clipPath = `circle(${coverR(c.x,c.y)}px at ${c.x}px ${c.y}px)`;
  void L.offsetWidth;
  L.classList.add("anim"); L.classList.remove("shown"); L.style.clipPath = `circle(${c.r}px at ${c.x}px ${c.y}px)`;
  await sleep(520);
  S.view = pid; S.cat = "All"; S.theme = null; renderList(); renderDock(); L.scrollTop = 0;
  history.replaceState(null, "", "#" + pid);
  void L.offsetWidth;
  L.classList.add("shown"); L.style.clipPath = `circle(${coverR(c.x,c.y)}px at ${c.x}px ${c.y}px)`;
  await sleep(780); L.style.clipPath = "none"; S.anim = false;
}

/* ---------- list ---------- */
function renderList(){
  const pid = S.view; if(!pid) return;
  const mine = S.items.filter(i => i.person_id === pid);
  const open = mine.filter(i=>!i.done), done = mine.filter(i=>i.done);
  const counts = {}; open.forEach(i => { const c=i.category||"Other"; counts[c]=(counts[c]||0)+1; });
  const cats = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  if(S.cat!=="All" && S.cat!=="Completed" && S.cat!=="Available" && !counts[S.cat]) S.cat="All";
  // reservations are only ever shown to friends, never to the wishlist owner
  const seeGifts = !!S.me && !isMine(pid), resOf = it => seeGifts ? S.res[it.id] : null;
  const free = open.filter(i => !resOf(i));
  if(S.cat === "Available" && !seeGifts) S.cat = "All";
  const chips = [["All",open.length], ...(seeGifts && free.length !== open.length ? [["Available", free.length]] : []), ...cats.map(c=>[c,counts[c]]), ["Completed",done.length]];
  const base = S.cat==="Completed" ? done : S.cat==="Available" ? free : open.filter(i => S.cat==="All" || (i.category||"Other")===S.cat);
  const tcount = {}; base.forEach(i => { if(themeOf(i.theme)) tcount[i.theme] = (tcount[i.theme]||0) + 1; });
  if(S.theme && !tcount[S.theme]) S.theme = null;
  const list = S.theme ? base.filter(i => i.theme === S.theme) : base;

  const own = isMine(pid);

    </div>`;
  // themed islands stacked top to bottom; inside each, a masonry-ish scatter with its own sizes, tilts and "weight"
  const COLW = 230, byTheme = {};
  if(list.length) byTheme[""] = list;
  const order = list.length ? [""] : [];
  const islands = false;
  let yCur = islands ? 30 : 0, maxX = 0, maxY = 0, k = 0, html = "";
  S.islands = {};
  for(const key of order){
    const items = byTheme[key], t = themeOf(key);
    const cols = islands ? (items.length === 1 ? 1 : 2) : (items.length <= 3 ? Math.max(1, items.length) : items.length <= 8 ? 2 : items.length <= 20 ? 3 : 4);
    const ox = islands ? Math.round((2*COLW - cols*COLW)/2) : 0, top = yCur + (islands ? 48 : 0);
    const colY = Array(cols).fill(0).map((_, c) => c % 2 ? 46 : 0);
    let bottom = top, cards = "";
    for(const it of items){
      const r = rng(it.id), c = colY.indexOf(Math.min(...colY));
      const w = Math.round(158 + r()*44), h = Math.round(w * [1, 1.18, .86, 1.08][Math.floor(r()*4)]);
      const x = Math.round(ox + c*COLW + (COLW - w)/2 + (r()-.5)*30), y = Math.round(top + colY[c] + (r()-.5)*20);
      colY[c] = y - top + h + 110 + r()*34;
      maxX = Math.max(maxX, x + w); bottom = Math.max(bottom, y + h + 90);
      const it_t = themeOf(it.theme);
      const img = it.image_url ? `<img src="${esc(it.image_url)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : esc((it.name||"?")[0].toUpperCase());
      const rv = resOf(it), rvMine = rv && rv.person_id === S.me;
      cards += `<button class="card ${it.done?'done':''} ${rv && !rvMine ? 'taken' : ''}" data-id="${esc(it.id)}" style="left:${x}px;top:${y}px;width:${w}px;--d:${(.5 + r()*1).toFixed(2)};--r:${((r()-.5)*6).toFixed(2)};animation-delay:${120 + Math.min(k++,14)*45}ms">
      ${it_t ? `<span class="stk" title="${esc(it_t.n)}">${it_t.e}</span>` : ``}

      <div class="cimg ${it.image_url ? (isCutout(it.image_url) ? 'cutout' : '') : 'empty'}" style="height:${h}px">${img}</div>
      <i class="string"></i>
      <div class="tag"><b>${esc(it.name)}</b>${it.brand || it.price ? `<span>${esc([it.brand, it.price].filter(Boolean).join(" · "))}</span>` : ``}</div>
    </button>`;
    }
    if(islands){
      const box = { x: ox - 26, y: yCur, w: cols*COLW + 52, h: bottom - yCur + 6 };
      S.islands[key || "_"] = box;
      const label = t ? `<span class="e">${t.e}</span>${esc(t.n)}` : `<span class="e">🫧</span>Anything`;
      html += `<div class="island" style="left:${box.x}px;top:${box.y}px;width:${box.w}px;height:${box.h}px;${t ? themeVars(t) : "--tc:#ecebe8;--ti:#555"};--r:${(rng(key).call()-.5).toFixed(2)}">
        <button class="isl-label" data-island="${esc(key || "_")}">${label}<span class="n">${items.length}</span></button></div>`;
      maxX = Math.max(maxX, box.x + box.w);
    }
    html += cards;
    yCur = bottom + (islands ? 70 : 0);
  }
  maxY = Math.max(maxY, yCur);
  $("lw").innerHTML = html;
  $("lmsg").innerHTML = list.length ? "" : (S.cat==="Completed"
      ? `<div class="empty-state"><b>Nothing completed yet</b>Wishes marked as done land here.</div>`
      : `<div class="empty-state"><b>${own ? "Your wishlist is empty" : "Nothing here yet"}</b>${own ? "Tap + to add the first thing." : ""}</div>`);
  LB.setBounds({ minX: islands ? -40 : -10, minY:-10, maxX:Math.max(maxX, 200) + (islands ? 30 : 10), maxY:Math.max(maxY, 200) + 10 });
  const key = pid + "|" + S.cat + "|" + (S.theme||"") + "|" + list.length;
  if(S.listKey !== key){ S.listKey = key; LB.fit(false); }
  $("back").onclick = climbOut;

  };
  $("add").hidden = !own;
}

  return `<div class="gift">
      <div class="gl"><div class="av">${avatarHTML(rv.person_id)}</div>${rv.status === "bought" ? "✓ Already bought by " : "🎁 Taken by "}${esc(displayName(rv.person_id))}</div>

function wireGift(it){
  const take = $("g-take"), bought = $("g-bought"), drop = $("g-drop");
  if(take) take.onclick = async () => {
    take.disabled = true;
    const { data, error } = await sb.from("reservations").insert({ item_id: it.id, person_id: S.me }).select().single();
    if(error){ toast(error.code === "23505" ? "Someone just took it" : "Couldn't save — try again"); await load().catch(()=>{}); return; }

  };
  if(bought) bought.onclick = async () => {
    const st = S.res[it.id].status === "bought" ? "reserved" : "bought";
    const { error } = await sb.from("reservations").update({ status: st }).eq("item_id", it.id).eq("person_id", S.me);
    if(error) return toast("Couldn't save — try again");
    S.res[it.id].status = st; toast(st === "bought" ? "Marked as bought ✓" : "Back to reserved"); renderAll();
  };
  if(drop) drop.onclick = async () => {
    const { error } = await sb.from("reservations").delete().eq("item_id", it.id).eq("person_id", S.me);
    if(error) return toast("Couldn't cancel — try again");
    delete S.res[it.id]; toast("Reservation cancelled"); renderAll();
  };
}

/* ---------- currency ---------- */
const CURRENCIES = [
  { k:"KGS", s:"сом", pre:false }, { k:"KZT", s:"₸", pre:false }, { k:"RUB", s:"₽", pre:false }, { k:"UZS", s:"сум", pre:false },
  { k:"USD", s:"$", pre:true }, { k:"EUR", s:"€", pre:true }, { k:"GBP", s:"£", pre:true }, { k:"TRY", s:"₺", pre:false },
  { k:"CNY", s:"¥", pre:true }, { k:"KRW", s:"₩", pre:true }, { k:"AED", s:"AED", pre:false }
];
const myCurrency = () => personById(S.me)?.currency || "KGS";
function formatPrice(raw, cur){
  const t = String(raw || "").trim(); if(!t) return "";
  if(!/^[\d\s.,]+$/.test(t)) return t;                       // already has a symbol or words: keep as typed
  const n = Number(t.replace(/\s/g, "").replace(/,(?=\d{1,2}$)/, ".").replace(/,/g, ""));
  if(!isFinite(n)) return t;
  const c = CURRENCIES.find(x => x.k === cur) || CURRENCIES[0];
  const num = n.toLocaleString("ru-RU", { maximumFractionDigits: 2 }).replace(/\u00a0/g, " ");
  return c.pre ? c.s + num : num + " " + c.s;
}
function splitPrice(text){
  const t = String(text || "").trim();
  for(const c of CURRENCIES){
    if(c.pre && t.startsWith(c.s)) return { amount: t.slice(c.s.length).trim(), cur: c.k };
    if(!c.pre && t.endsWith(" " + c.s)) return { amount: t.slice(0, -c.s.length - 1).trim(), cur: c.k };
  }
  return { amount: t, cur: myCurrency() };
}

function daysToBirthday(b){
  if(!b) return null;
  const [y, m, d] = String(b).split("-").map(Number); if(!m || !d) return null;
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let next = new Date(today.getFullYear(), m - 1, d); if(next < today) next = new Date(today.getFullYear() + 1, m - 1, d);
  return Math.round((next - today) / 864e5);
}
const bdayLabel = b => { if(!b) return ""; const [, m, d] = String(b).split("-").map(Number); return new Date(2000, m - 1, d).toLocaleDateString("en-US", { month:"long", day:"numeric" }); };
const bdaySoon = b => { const n = daysToBirthday(b); return n === null ? "" : n === 0 ? "🎂 today!" : n <= 30 ? `🎂 in ${n} day${n === 1 ? "" : "s"}` : ""; };

/* ---------- background removal (runs on the phone, model is cached after the first use) ---------- */
const isCutout = u => !!u && /\/storage\/v1\/object\/public\/images\/[^?]+\.png(\?|$)/i.test(u);
let RMBG = null;
function loadRmbg(onProgress){
  if(!RMBG) RMBG = (async () => {
    const T = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1");
    T.env.allowLocalModels = false;
    const files = {};
    const progress_callback = p => {
      if(p.status === "progress" && p.total){ files[p.file] = [p.loaded, p.total]; let l = 0, t = 0; for(const [a,b] of Object.values(files)){ l += a; t += b; } onProgress && onProgress(l / t); }
    };
    const model = await T.AutoModel.from_pretrained("briaai/RMBG-1.4", { config:{ model_type:"custom" }, dtype:"q8", progress_callback });
    const processor = await T.AutoProcessor.from_pretrained("briaai/RMBG-1.4", { config:{ do_normalize:true, do_pad:false, do_rescale:true, do_resize:true, image_mean:[.5,.5,.5], feature_extractor_type:"ImageFeatureExtractor", image_std:[1,1,1], resample:2, rescale_factor:1/255, size:{ width:1024, height:1024 } } });
    return { T, model, processor };
  })().catch(e => { RMBG = null; throw e; });
  return RMBG;
}
async function removeBackground(src, onProgress){
  const { T, model, processor } = await loadRmbg(onProgress);
  const url = src instanceof Blob ? URL.createObjectURL(src) : src;
  const image = await T.RawImage.fromURL(url);
  if(src instanceof Blob) URL.revokeObjectURL(url);
  const { pixel_values } = await processor(image);
  const { output } = await model({ input: pixel_values });
  const mask = await T.RawImage.fromTensor(output[0].mul(255).to("uint8")).resize(image.width, image.height);
  const c = document.createElement("canvas"); c.width = image.width; c.height = image.height;
  const ctx = c.getContext("2d"); ctx.drawImage(image.toCanvas(), 0, 0);
  const px = ctx.getImageData(0, 0, c.width, c.height), a = mask.data;
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for(let i = 0, y = 0; y < c.height; y++) for(let x = 0; x < c.width; x++, i++){
    px.data[i*4 + 3] = a[i];
    if(a[i] > 24){ if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y; }
  }
  if(x1 < 0) throw new Error("nothing found");
  ctx.putImageData(px, 0, 0);
  // trim to the object with a little air around it
  const pad = Math.round(Math.max(x1 - x0, y1 - y0) * .04);
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(c.width - 1, x1 + pad); y1 = Math.min(c.height - 1, y1 + pad);
  const o = document.createElement("canvas"); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
  o.getContext("2d").drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  return await new Promise((res, rej) => o.toBlob(b => b ? res(b) : rej(new Error("encode")), "image/png"));
}

$("file").onchange = async e => {

    return;

async function useImageFile(f, square){
  try{
    const blob = await shrink(f, square ? 400 : 1000, square);
    const preview = URL.createObjectURL(blob);
    S.draft = { blob, preview };
    const el = $(square ? "pick-av" : "pick"); if(el) el.innerHTML = `<img src="${preview}" alt="">` + (el.classList.contains("pf-av") ? `<span class="cam">Change photo</span>` : ``);
    if(!square){ refreshBgBtn(); const st = $("f-bgst"); if(st) st.textContent = ""; }
  }catch(err){ const er=$("f-err"); if(er) er.textContent = "Couldn't read that image"; }
}
function shrink(file, max, square){
  return new Promise((res, rej) => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      let sx=0, sy=0, sw=img.width, sh=img.height;
      if(square){ const m=Math.min(sw,sh); sx=(sw-m)/2; sy=(sh-m)/2; sw=sh=m; }
      const r = Math.min(1, max/Math.max(sw,sh));
      const c = document.createElement("canvas"); c.width=Math.round(sw*r); c.height=Math.round(sh*r);
      const x = c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
      URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(), "image/jpeg", .86);
    };
    img.onerror = rej; img.src = u;
  });
}
async function uploadImage(blob){
  const png = blob.type === "image/png";
  const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${png ? "png" : "jpg"}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: png ? "image/png" : "image/jpeg", upsert:false });
  if(error) throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

      <label class="field"><span>Brand</span><input id="f-brand" maxlength="40" value="${esc(it?.brand)}" placeholder="Apple"></label>
      <label class="field"><span>Price</span><div class="price-in"><input id="f-price" maxlength="24" inputmode="decimal" value="${esc(splitPrice(it?.price).amount)}" placeholder="0"><select id="f-cur" aria-label="Currency">${CURRENCIES.map(c => `<option value="${c.k}" ${c.k === splitPrice(it?.price).cur ? "selected" : ""}>${c.s}</option>`).join("")}</select></div></label>
    </div>
    <label class="field"><span>Description</span><textarea id="f-desc" maxlength="600" placeholder="Size, colour, why you want it…">${esc(it?.description)}</textarea></label>
    <div class="field" style="border:0"><span>Category</span>
      <div class="cats" id="f-cats">${cats.map(c=>`<button type="button" data-c="${esc(c)}" class="${c===cur?'on':''}">${esc(c)}</button>`).join("")}<button type="button" data-c="__new">+ new</button></div>
    </div>
    <div class="field" style="border:0;padding-top:4px"><span>Theme</span>
      <div class="themes" id="f-themes">${[...THEMES, ...customThemes().filter(t => t.owner === S.me || t.k === it?.theme)].map(t => `<button type="button" data-t="${t.k}" class="${it?.theme===t.k?'on':''}" style="${themeVars(t)}">${esc(t.e)} ${esc(t.n)}</button>`).join("")}<button type="button" data-t="__new">+ new</button></div>
      <div class="newtheme" id="f-newtheme" hidden><input class="e" id="nt-e" maxlength="4" placeholder="🎓"><input class="n" id="nt-n" maxlength="24" placeholder="Graduation"><button type="button" id="nt-add">Add</button></div>
    </div>
    <div class="err" id="f-err"></div>
    <div class="row"><button class="btn" id="f-cancel">Cancel</button><button class="btn dark" id="f-save">${it ? "Save" : "Add to list"}</button></div>`;
  const form = { category: cur, theme: it?.theme || null };
  $("f-themes").onclick = e => {
    const b = e.target.closest("button[data-t]"); if(!b) return;
    if(b.dataset.t === "__new"){ const nt = $("f-newtheme"); nt.hidden = !nt.hidden; if(!nt.hidden) $("nt-n").focus(); return; }
    form.theme = form.theme === b.dataset.t ? null : b.dataset.t;
    $("f-themes").querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.t === form.theme));
  };
  form.setCat = c => {
    if(!c) return;
    let b = [...$("f-cats").querySelectorAll("button[data-c]")].find(x => x.dataset.c.toLowerCase() === c.toLowerCase());
    if(!b){ b = document.createElement("button"); b.type="button"; b.dataset.c=c; b.textContent=c; $("f-cats").prepend(b); }
    form.category = b.dataset.c; $("f-cats").querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
  };
  $("f-cats").onclick = e => {
    const b = e.target.closest("button"); if(!b) return;
    if(b.dataset.c==="__new"){
      const inp=document.createElement("input"); inp.placeholder="Category"; inp.maxLength=24;
      inp.style.cssText="border:0;border-radius:999px;padding:5px 11px;font-size:16px;width:120px;outline:none";
      b.replaceWith(inp); inp.focus();
      inp.oninput=()=>{ form.category=inp.value.trim(); $("f-cats").querySelectorAll("button").forEach(x=>x.classList.remove("on")); };
      return;
    }
    form.setCat(b.dataset.c);
  };
  $("pick").onclick = () => { pickTarget="item"; $("file").click(); };
  $("f-bg").onclick = toggleBackground;
  if(isCutout(it?.image_url)) $("pick").classList.add("cut");
  refreshBgBtn(); if(S.draft?.remote && isCutout(S.draft.remote)) $("f-bg").hidden = true;
  $("f-cancel").onclick = () => { autoCtl?.abort(); closeSheets(); };
  $("f-save").onclick = () => save(form.category, form.theme);
  $("nt-add").onclick = async () => {
    const name = $("nt-n").value.trim(), emoji = $("nt-e").value.trim() || "⭐";
    if(!name){ $("nt-n").focus(); return; }
    $("nt-add").disabled = true;
    const { data, error } = await sb.from("themes").insert({ person_id:S.me, name, emoji, color: S.ctheme.length % PALETTE.length }).select().single();
    $("nt-add").disabled = false;
    if(error) return toast("Couldn't add the theme");
    S.ctheme.push(data); const t = themeOf("c:" + data.id); form.theme = t.k;
    const btn = document.createElement("button"); btn.type = "button"; btn.dataset.t = t.k; btn.className = "on"; btn.setAttribute("style", themeVars(t)); btn.textContent = `${t.e} ${t.n}`;
    $("f-themes").querySelectorAll("button").forEach(x => x.classList.remove("on"));
    $("f-themes").insertBefore(btn, $("f-themes").querySelector('[data-t="__new"]'));
    $("f-newtheme").hidden = true; $("nt-n").value = ""; $("nt-e").value = "";
  };

  const linkEl = $("f-link"), autoBtn = $("f-auto");
  const refreshBtn = () => { autoBtn.hidden = !extractUrl(linkEl.value); };
  linkEl.addEventListener("input", refreshBtn);
  linkEl.addEventListener("paste", () => setTimeout(() => {
    refreshBtn();
    if(!S.editing && extractUrl(linkEl.value) && !$("f-name").value.trim()) autofill(form);
  }, 0));
  autoBtn.onclick = () => autofill(form);
  refreshBtn();
  openSheet("form");
  if(!it) setTimeout(()=>linkEl.focus({preventScroll:true}), 350);
}

/* ---------- autofill from a link ---------- */
let autoCtl = null;
function extractUrl(text){
  const m = String(text||"").match(/https?:\/\/[^\s<>"']+/i) || String(text||"").match(/\b(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)+\/[^\s<>"']*/i);
  return m ? m[0].replace(/[),.;!?]+$/, "") : "";
}
const CAT_WORDS = {
  Tech:/headphone|наушник|iphone|phone|телефон|laptop|ноутбук|macbook|ipad|tablet|планшет|camera|камер|kindle|watch|час|keyboard|клавиатур|mouse|мыш|speaker|колонк|airpods|charger|заряд|console|playstation|nintendo|xbox/i,
  Beauty:/cream|крем|serum|сыворот|шампун|shampoo|parfum|perfume|парфюм|духи|помад|lipstick|mascara|туш|skincare|уход|маск|mask|лосьон|lotion|make.?up|макияж/i,
  Clothes:/dress|плать|shirt|рубаш|футболк|t-shirt|jeans|джинс|jacket|куртк|пальто|coat|sneaker|кроссовк|shoe|обув|ботин|boot|hoodie|худи|свитер|sweater|bag|сумк|юбк|skirt/i,
  Home:/кружк|mug|cup|чашк|lamp|ламп|pillow|подушк|blanket|плед|посуд|kitchen|кухн|candle|свеч|пятновывод|отбелив|чистящ|clean|стирк|порош|ваза|vase|полотен|towel/i,
  Books:/book|книг|novel|роман/i,
};
const guessCat = t => Object.keys(CAT_WORDS).find(k => CAT_WORDS[k].test(t)) || "";
function slugGuess(url){
  try{
    const u = new URL(url); const segs = u.pathname.split("/").filter(Boolean);
    const best = segs.map(s => decodeURIComponent(s)).filter(s => /[a-zа-я]{3,}.*-.*[a-zа-я]{3,}/i.test(s)).sort((a,b)=>b.length-a.length)[0];
    if(!best) return "";
    let t = best.replace(/\.(html?|php)$/,"").replace(/-\d{5,}$/,"").replace(/[-_]+/g," ").trim();
    return t.charAt(0).toUpperCase() + t.slice(1);
  }catch(e){ return ""; }
}
async function autofill(form){
  const raw = $("f-link").value.trim(), url = extractUrl(raw);
  if(!url) return;
  const shareText = raw.replace(url, "").trim();
  if(shareText) $("f-link").value = url;
  autoCtl?.abort(); autoCtl = new AbortController(); const ctl = autoCtl;
  const st = $("f-status"), btn = $("f-auto");
  st.className = "auto-status on"; st.innerHTML = `<span class="dot"></span>Opening the shop page…`; btn.hidden = true;
  let r = {};
  try{
    const { data, error } = await sb.functions.invoke("preview", { body: { url } });
    if(!error && data) r = data;
  }catch(e){}
  if(ctl.signal.aborted || !$("form").classList.contains("on")) return;
  if(r.name && r.name.length > 60 && r.name.includes(",")) r.name = r.name.split(",")[0];
  if(!r.name && shareText) r.name = shareText.replace(/\s+/g," ").slice(0,120);
  if(!r.name) r.name = slugGuess(url);
  const fill = (id, v) => { const el = $(id); v = String(v||"").trim(); if(v && !el.value.trim()){ el.value = v; el.classList.add("filled"); setTimeout(()=>el.classList.remove("filled"), 1200); } };
  const sp = splitPrice(r.price); if(r.price && !$("f-price").value.trim()) $("f-cur").value = sp.cur;
  fill("f-name", r.name); fill("f-brand", r.brand); fill("f-price", sp.amount); fill("f-desc", r.description);
  let gotImg = false;
  if(r.image && !S.draft?.blob){
    S.draft = { remote: r.image };
    $("pick").innerHTML = `<img src="${esc(r.image)}" alt="" referrerpolicy="no-referrer">`;
    gotImg = true; refreshBgBtn();
  }
  if(!form.category){ const g = guessCat(`${r.name} ${r.description||""} ${url}`); if(g) form.setCat(g); }
  btn.hidden = false; btn.textContent = "✦ Refill";
  if(r.name && (r.image || r.price)){ st.className = "auto-status on ok"; st.textContent = "Filled in ✓ — check the details"; }
  else if(r.name){ st.className = "auto-status on warn"; st.textContent = "The shop didn't share its photo — tap the photo area to add one"; }
  else { st.className = "auto-status on warn"; st.textContent = "Couldn't read this shop page — fill it in by hand"; }
}

let saving=false;
async function save(category, theme){
  if(saving) return;
  const name = $("f-name").value.trim();
  if(!name){ $("f-err").textContent="Give it a name"; $("f-name").focus(); return; }
  saving=true; $("f-save").textContent="Saving…";
  try{
    let image_url = S.draft?.remote || null;
    if(S.draft?.blob) image_url = await uploadImage(S.draft.blob);
    const body = { name, brand:$("f-brand").value.trim(), price:formatPrice($("f-price").value, $("f-cur").value),
                   link:(extractUrl($("f-link").value)||$("f-link").value.trim()), description:$("f-desc").value.trim(),
                   category: category||"Other", theme: theme || null, image_url };
    if(S.editing){
      const { error } = await sb.from("items").update(body).eq("id", S.editing.id); if(error) throw error;
      Object.assign(S.items.find(i=>i.id===S.editing.id) || {}, body); toast("Saved");
    } else {
      const { data, error } = await sb.from("items").insert({ ...body, person_id:S.me, done:false }).select().single(); if(error) throw error;
      S.items.unshift(data); toast("Added to your list");
    }
    closeSheets(); renderAll();
  }catch(e){ $("f-err").textContent = "Couldn't save — try again"; }
  finally{ saving=false; const b=$("f-save"); if(b) b.textContent = S.editing ? "Save" : "Add to list"; }
}
